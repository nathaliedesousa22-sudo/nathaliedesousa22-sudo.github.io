<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e2574c">
<meta name="description" content="Mots mêlés pour enfants : 5 thèmes, 3 niveaux, 75 grilles pleines. Pétales à chaque mot trouvé et feu d'artifice à la fin.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<title>Mots mêlés junior</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url("polices/atkinson-400.woff") format("woff")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url("polices/atkinson-700.woff") format("woff")}
@font-face{font-family:Fredoka;font-weight:500 600;font-display:swap;src:url("polices/fredoka-600.woff") format("woff")}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url("polices/fredoka-700.woff") format("woff")}
html{overscroll-behavior:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
:root{
  --papier:#fbf8f1; --ligne:#c9d8ee; --marge:#e9a3a3; --encre:#23324d; --encre-douce:#5b6782;
  --carte:#ffffff; --bord:#e4dccb; --ombre:rgba(60,48,20,.12);
  --accent:#e2574c; --accent-fg:#ffffff; --ok:#3f9b5c; --case:#ffffffcc; --case-bord:#e6e0d2;
  --vert:#5fbf73; --bleu:#5b9bf0; --jaune:#f6c445; --rose:#f27aa6; --orange:#f39a4a; --violet:#a07be8; --turquoise:#3cc3c0; --rouge:#ec6a5e;
  --surligne:.42;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papier:#1c2233; --ligne:#2a3550; --marge:#5a3341; --encre:#eef1f8; --encre-douce:#a9b3c9;
  --carte:#252d42; --bord:#36405a; --ombre:rgba(0,0,0,.35);
  --accent:#ff7a6e; --accent-fg:#1c2233; --ok:#6fd38b; --case:#252d42cc; --case-bord:#36405a;
  --surligne:.55; color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#1c2233; --ligne:#2a3550; --marge:#5a3341; --encre:#eef1f8; --encre-douce:#a9b3c9;
  --carte:#252d42; --bord:#36405a; --ombre:rgba(0,0,0,.35);
  --accent:#ff7a6e; --accent-fg:#1c2233; --ok:#6fd38b; --case:#252d42cc; --case-bord:#36405a;
  --surligne:.55; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--papier); color:var(--encre);
  background-image:linear-gradient(90deg,transparent 46px,var(--marge) 46px,var(--marge) 48px,transparent 48px),
                   repeating-linear-gradient(180deg,transparent 0 31px,var(--ligne) 31px 32px);
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif; font-size:17px; line-height:1.45;
  min-height:100vh; -webkit-tap-highlight-color:transparent;
}
.page{max-width:760px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,.titre{font-family:Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.entete{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}
.marque{display:flex;flex-direction:column}
.marque h1{font-size:clamp(28px,7vw,42px);line-height:1.05;color:var(--encre)}
.marque h1 span{color:var(--accent)}
.marque p{margin:2px 0 0;color:var(--encre-douce);font-size:15px}
.rond{width:46px;height:46px;border-radius:50%;border:2px solid var(--bord);background:var(--carte);
  display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--ombre);flex:none}
.rond:active{transform:translateY(2px);box-shadow:none}

/* Accueil */
.etiquette{font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--encre-douce);margin:22px 0 10px}
.niveaux{display:flex;gap:8px;flex-wrap:wrap}
.niveau{flex:1 1 0;min-width:96px;padding:12px 10px;border-radius:16px;border:2px solid var(--bord);background:var(--carte);
  font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;box-shadow:0 3px 0 var(--ombre);display:flex;flex-direction:column;align-items:center;gap:2px}
.niveau small{font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:13px;color:var(--encre-douce)}
.niveau[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.niveau[aria-pressed="true"] small{color:inherit;opacity:.9}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.theme{position:relative;text-align:left;padding:16px 16px 14px;border-radius:20px;border:2px solid var(--bord);background:var(--carte);
  box-shadow:0 4px 0 var(--ombre);display:flex;flex-direction:column;gap:8px;min-height:132px;overflow:hidden}
.theme:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ombre)}
.theme .pic{font-size:40px;line-height:1}
.theme .nom{font-family:Fredoka,sans-serif;font-weight:600;font-size:21px}
.theme .bande{position:absolute;inset:0 0 auto 0;height:7px;background:var(--c)}
.etoiles{display:flex;gap:3px;flex-wrap:wrap;font-size:15px;color:var(--encre-douce)}
.etoiles i{font-style:normal;opacity:.28}
.etoiles i.oui{opacity:1}

/* Jeu */
.barre{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.barre .infos{flex:1;min-width:0}
.barre h2{font-size:24px;line-height:1.1}
.barre p{margin:0;color:var(--encre-douce);font-size:15px}
.zone{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:720px){.zone{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.cadre{background:var(--carte);border:2px solid var(--bord);border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--ombre)}
.grille{position:relative;container-type:inline-size;width:100%;aspect-ratio:1;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.grille svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cases{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr)}
.case{display:grid;place-items:center;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700;
  font-size:calc(100cqi / var(--n) * .56);color:var(--encre);border-right:1px dashed var(--case-bord);border-bottom:1px dashed var(--case-bord)}
.case.ancre{animation:clignote 1s ease-in-out infinite}
.case.indice{animation:indice .6s ease-in-out 3}
@keyframes clignote{50%{color:var(--accent);transform:scale(1.18)}}
@keyframes indice{50%{color:var(--accent);transform:scale(1.45)}}
.liste{background:var(--carte);border:2px solid var(--bord);border-radius:22px;padding:14px 14px 16px;box-shadow:0 5px 0 var(--ombre)}
.liste .haut{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.compte{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px}
.pouce{border:2px solid var(--bord);background:var(--papier);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.mots{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.mot{padding:5px 11px;border-radius:999px;border:2px solid var(--bord);font-size:18px;font-weight:700;transition:all .3s}
.mot.trouve{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--encre);border-color:transparent;
  background:color-mix(in srgb,var(--c) 45%,transparent);color:var(--encre-douce)}
.consigne{margin:12px 0 0;font-size:14px;color:var(--encre-douce)}

/* Bravo */
.voile{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,24,40,.35);z-index:30;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bravo{background:var(--carte);border:3px solid var(--bord);border-radius:28px;padding:26px 22px;max-width:380px;width:100%;text-align:center;
  box-shadow:0 8px 0 var(--ombre);animation:pop .5s cubic-bezier(.2,1.5,.5,1)}
.bravo .grand{font-size:56px;line-height:1}
.bravo h2{font-size:36px;color:var(--accent);margin:8px 0 4px}
.bravo p{margin:0 0 18px;color:var(--encre-douce)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:16px;padding:14px 16px;font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 0 var(--ombre)}
.btn.second{background:var(--papier);color:var(--encre);border:2px solid var(--bord)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#feux{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.petale{position:fixed;left:0;top:0;width:14px;height:18px;border-radius:0 100% 0 100%;pointer-events:none;z-index:35;will-change:transform,opacity}
.pied{margin-top:28px;text-align:center;color:var(--encre-douce);font-size:14px}
@media (prefers-reduced-motion:reduce){.case.ancre,.case.indice{animation:none;color:var(--accent)}.bravo{animation:none}}
</style>
</head>

<div class="page">
  <div id="accueil">
    <div class="entete">
      <div class="marque">
        <h1>Mots mêlés <span>junior</span></h1>
        <p>Trouve tous les mots cachés dans la grille !</p>
      </div>
      <button class="rond" id="son" aria-label="Couper le son" title="Son">🔊</button>
    </div>
    <div class="etiquette">1. Choisis ton niveau</div>
    <div class="niveaux" id="niveaux"></div>
    <div class="etiquette">2. Choisis ton thème</div>
    <div class="themes" id="themes"></div>
    <p class="pied">Une création Naty Mey · <a href="confidentialite.html" style="color:inherit">Confidentialité</a></p>
  </div>

  <div id="jeu" hidden>
    <div class="barre">
      <button class="rond" id="retour" aria-label="Retour au menu">←</button>
      <div class="infos"><h2 id="jeu-titre"></h2><p id="jeu-sous"></p></div>
      <button class="rond" id="son2" aria-label="Couper le son" title="Son">🔊</button>
    </div>
    <div class="zone">
      <div class="cadre"><div class="grille" id="grille">
        <svg id="traits" aria-hidden="true"></svg>
        <div class="cases" id="cases" role="grid" aria-label="Grille de lettres"></div>
      </div></div>
      <div class="liste">
        <div class="haut"><span class="compte" id="compte"></span><button class="pouce" id="pouce">💡 Coup de pouce</button></div>
        <ul class="mots" id="mots"></ul>
        <p class="consigne">Glisse ton doigt de la première à la dernière lettre d'un mot. Tu peux aussi toucher la première lettre, puis la dernière.</p>
      </div>
    </div>
  </div>
</div>

<div class="voile" id="voile" hidden>
  <div class="bravo" role="dialog" aria-labelledby="bravo-titre">
    <div class="grand">🏆</div>
    <h2 id="bravo-titre">Bravo !</h2>
    <p id="bravo-texte"></p>
    <div class="actions">
      <button class="btn" id="suivante">Grille suivante →</button>
      <button class="btn second" id="menu">Retour au menu</button>
    </div>
  </div>
</div>
<canvas id="feux" hidden></canvas>

function lire(cle, defaut){ try{ const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }catch(e){ return defaut; } }

/* Son */
let audio = null;
function note(freq, debut, duree, vol){
  if(!sonActif) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + debut;
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + duree);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + duree + .05);
  }catch(e){}
}

    b.className = "theme"; b.style.setProperty("--c", t.c);
    b.innerHTML = `<span class="bande"></span><span class="pic">${t.pic}</span><span class="nom">${t.nom}</span>
      <span class="etoiles" aria-label="${fait.length} grilles réussies sur ${liste.length}">${liste.map((_,i)=>`<i class="${fait.includes(i)?"oui":""}">★</i>`).join("")}</span>`;
    b.onclick = () => { const i = liste.findIndex((_,k)=>!fait.includes(k)); jouer(t, i < 0 ? 0 : i); };
    zt.appendChild(b);
  }
  scrollTo(0,0);
}

/* Jeu */
let partie = null;
function jouer(theme, index){
  const g = GRILLES[theme.nom][niveau][index];
  const n = g.grille.length;
  partie = {theme, index, g, n, trouves:new Set(), couleur:0, ancre:null};
  $("#accueil").hidden = true; $("#jeu").hidden = false; $("#voile").hidden = true;
  $("#jeu-titre").textContent = theme.pic + " " + theme.nom;
  $("#jeu-sous").textContent = `${NIVEAUX.find(x=>x.id===niveau).nom} · grille ${index+1} sur ${GRILLES[theme.nom][niveau].length}`;
  const grille = $("#grille"); grille.style.setProperty("--n", n);
  const cases = $("#cases"); cases.innerHTML = "";
  g.grille.forEach((ligne,r)=>[...ligne].forEach((l,c)=>{
    const d = document.createElement("div"); d.className = "case"; d.textContent = l; d.dataset.r = r; d.dataset.c = c;
    if(c === n-1) d.style.borderRight = "0"; if(r === n-1) d.style.borderBottom = "0";
    cases.appendChild(d);
  }));
  const svg = $("#traits"); svg.setAttribute("viewBox", `0 0 ${n} ${n}`); svg.innerHTML = "";
  partie.temp = trait(svg, "--bleu"); partie.temp.style.display = "none";
  const ul = $("#mots"); ul.innerHTML = "";
  partie.puces = {};
  [...g.mots].sort((a,b)=>a.affiche.localeCompare(b.affiche,"fr")).forEach(m=>{
    const li = document.createElement("li"); li.className = "mot"; li.textContent = m.affiche; ul.appendChild(li); partie.puces[m.mot] = li;
  });
  majCompte(); scrollTo(0,0);
}
function trait(svg, crayon){
  const l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("stroke-linecap","round"); l.setAttribute("stroke-width",".78");
  l.style.stroke = `var(${crayon})`; l.style.opacity = "var(--surligne)";
  svg.appendChild(l); return l;
}
function placer(l, a, b){
  l.setAttribute("x1", a[1]+.5); l.setAttribute("y1", a[0]+.5); l.setAttribute("x2", b[1]+.5); l.setAttribute("y2", b[0]+.5);
}
function majCompte(){ $("#compte").textContent = `${partie.trouves.size} / ${partie.g.mots.length} mots`; }

function caseSous(x, y, libre){
  const r = $("#grille").getBoundingClientRect(), n = partie.n;
  let c = Math.floor((x - r.left) / r.width * n), l = Math.floor((y - r.top) / r.height * n);
  if(!libre && (c < 0 || l < 0 || c >= n || l >= n)) return null;
  return [Math.max(0,Math.min(n-1,l)), Math.max(0,Math.min(n-1,c))];
}
function aligner(a, b){
  let dr = b[0]-a[0], dc = b[1]-a[1];
  if(!dr && !dc) return b;
  const ang = Math.round(Math.atan2(dr, dc) / (Math.PI/4)) * (Math.PI/4);
  const sr = Math.round(Math.sin(ang)), sc = Math.round(Math.cos(ang));
  let k = Math.max(Math.abs(dr), Math.abs(dc));
  const n = partie.n;
  while(k > 0 && (a[0]+sr*k < 0 || a[0]+sr*k >= n || a[1]+sc*k < 0 || a[1]+sc*k >= n)) k--;
  return [a[0]+sr*k, a[1]+sc*k];
}
function chemin(a, b){
  const dr = Math.sign(b[0]-a[0]), dc = Math.sign(b[1]-a[1]), k = Math.max(Math.abs(b[0]-a[0]), Math.abs(b[1]-a[1]));
  return Array.from({length:k+1}, (_,i)=>[a[0]+dr*i, a[1]+dc*i]);
}
function essayer(a, b){
  const ch = chemin(a, b).map(p=>p.join(",")).join(";");
  for(const m of partie.g.mots){
    if(partie.trouves.has(m.mot)) continue;
    const s = m.cases.map(p=>p.join(",")), avant = s.join(";"), arriere = [...s].reverse().join(";");
    if(ch === avant || ch === arriere){ trouve(m); return true; }
  }
  return false;
}
function trouve(m){
  partie.trouves.add(m.mot);
  const crayon = CRAYONS[partie.couleur++ % CRAYONS.length];
  placer(trait($("#traits"), crayon), m.cases[0], m.cases[m.cases.length-1]);
  $("#traits").appendChild(partie.temp);
  const li = partie.puces[m.mot]; li.style.setProperty("--c", `var(${crayon})`); li.classList.add("trouve");
  majCompte(); dingMot(); petales(m, crayon);
  if(partie.trouves.size === partie.g.mots.length) setTimeout(victoire, calme ? 200 : 700);
}

/* Interaction : glisser, ou toucher deux lettres */
let depart = null, bouge = false;
const grilleEl = $("#grille");
grilleEl.addEventListener("pointerdown", e=>{
  const p = caseSous(e.clientX, e.clientY); if(!p) return;
  e.preventDefault();
  try{ grilleEl.setPointerCapture(e.pointerId); }catch(_){}
  depart = p; bouge = false;
  partie.temp.style.stroke = `var(${CRAYONS[partie.couleur % CRAYONS.length]})`;
  placer(partie.temp, p, p); partie.temp.style.display = "";
});
grilleEl.addEventListener("pointermove", e=>{
  if(!depart) return;
  const p = caseSous(e.clientX, e.clientY, true);
  if(p[0] !== depart[0] || p[1] !== depart[1]) bouge = true;
  placer(partie.temp, depart, aligner(depart, p));
});
function fin(e){
  if(!depart) return;
  const a = depart; depart = null;
  const p = caseSous(e.clientX, e.clientY, true), b = aligner(a, p);
  partie.temp.style.display = "none";
  if(bouge && (b[0] !== a[0] || b[1] !== a[1])){ effacerAncre(); essayer(a, b); return; }
  // toucher-toucher
  if(partie.ancre){
    const anc = partie.ancre; effacerAncre();
    if(anc[0] === a[0] && anc[1] === a[1]) return;
    essayer(anc, aligner(anc, a));
  } else {
    partie.ancre = a; caseEl(a).classList.add("ancre");
  }
}
grilleEl.addEventListener("pointerup", fin);
grilleEl.addEventListener("pointercancel", ()=>{ depart = null; partie.temp.style.display = "none"; });
function caseEl(p){ return $("#cases").children[p[0]*partie.n + p[1]]; }
function effacerAncre(){ if(partie.ancre){ caseEl(partie.ancre).classList.remove("ancre"); partie.ancre = null; } }

$("#pouce").onclick = ()=>{
  const reste = partie.g.mots.filter(m=>!partie.trouves.has(m.mot));
  if(!reste.length) return;
  const m = reste[Math.floor(Math.random()*reste.length)], el = caseEl(m.cases[0]);
  el.classList.remove("indice"); void el.offsetWidth; el.classList.add("indice");
  setTimeout(()=>el.classList.remove("indice"), 1900);
};

/* Jeté de pétales */
function petales(m, crayon){
  if(calme) return;
  const r = $("#grille").getBoundingClientRect(), n = partie.n;
  const mil = m.cases[Math.floor(m.cases.length/2)];
  const x0 = r.left + (mil[1]+.5) * r.width/n, y0 = r.top + (mil[0]+.5) * r.height/n;
  const st = getComputedStyle(document.documentElement);
  const teintes = [st.getPropertyValue(crayon), st.getPropertyValue("--rose"), "#ffd1e3", "#ffb3c7", st.getPropertyValue("--jaune")];
  for(let i=0;i<22;i++){
    const p = document.createElement("div"); p.className = "petale";
    p.style.background = teintes[i % teintes.length];
    document.body.appendChild(p);
    const ang = Math.random()*Math.PI*2, dist = 50 + Math.random()*110, dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 30;
    const rot = (Math.random()*2-1)*540, ech = .7 + Math.random()*.7, duree = 1100 + Math.random()*700;
    p.animate([
      {transform:`translate(${x0-7}px,${y0-9}px) rotate(0deg) scale(.3)`, opacity:1},
      {transform:`translate(${x0-7+dx}px,${y0-9+dy}px) rotate(${rot*.6}deg) scale(${ech})`, opacity:1, offset:.45},
      {transform:`translate(${x0-7+dx*1.25}px,${y0-9+dy+110}px) rotate(${rot}deg) scale(${ech*.9})`, opacity:0}
    ], {duration:duree, easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = ()=>p.remove();
  }
}

/* Feu d'artifice */
function feuArtifice(){
  if(calme) return;
  const cv = $("#feux"), ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.hidden = false; cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const W = innerWidth, H = innerHeight, fusees = [], etincelles = [];
  let lancees = 0, t0 = performance.now();
  const couleurs = ["#ff5d73","#ffd23f","#3bceac","#5b9bf0","#a07be8","#ff9f43","#f27aa6","#ffffff"];
  function lancer(){
    fusees.push({x: W*(.15+Math.random()*.7), y: H, vy: -(H*.012 + Math.random()*H*.004), cible: H*(.15+Math.random()*.3), c: couleurs[Math.floor(Math.random()*couleurs.length)]});
    lancees++;
  }
  function eclater(f){
    const nb = 70;
    for(let i=0;i<nb;i++){
      const a = i/nb*Math.PI*2, v = 2 + Math.random()*3.2;
      etincelles.push({x:f.x, y:f.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, vie:1, c: Math.random()<.25 ? "#ffffff" : f.c});
    }
  }
  function image(t){
    const ecoule = t - t0;
    if(lancees < 9 && ecoule > lancees*380) lancer();
    ctx.clearRect(0,0,W,H);
    for(let i=fusees.length-1;i>=0;i--){
      const f = fusees[i]; f.y += f.vy;
      ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, 7); ctx.fill();
      if(f.y <= f.cible){ eclater(f); fusees.splice(i,1); note(300+Math.random()*200,0,.25,.06); }
    }
    for(let i=etincelles.length-1;i>=0;i--){
      const s = etincelles[i]; s.x += s.vx; s.y += s.vy; s.vx *= .985; s.vy = s.vy*.985 + .05; s.vie -= .012;
      if(s.vie <= 0){ etincelles.splice(i,1); continue; }
      ctx.globalAlpha = s.vie; ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
    if(lancees < 9 || fusees.length || etincelles.length) requestAnimationFrame(image);
    else { ctx.clearRect(0,0,W,H); cv.hidden = true; }
  }
  requestAnimationFrame(image);
}

function victoire(){
  const cle = partie.theme.nom + "|" + niveau, f = faits[cle] || [];
  if(!f.includes(partie.index)) f.push(partie.index);
  faits[cle] = f; ecrire("mmj-faits", faits);
  const total = GRILLES[partie.theme.nom][niveau].length;
  $("#bravo-texte").textContent = `Tu as trouvé les ${partie.g.mots.length} mots ! La grille est pleine. (${f.length} ${f.length > 1 ? "grilles réussies" : "grille réussie"} sur ${total})`;
  $("#voile").hidden = false; fanfare(); feuArtifice();
  $("#suivante").focus();
}
$("#suivante").onclick = ()=>{
  const liste = GRILLES[partie.theme.nom][niveau], f = faits[partie.theme.nom + "|" + niveau] || [];
  let i = liste.findIndex((_,k)=>k > partie.index && !f.includes(k));
  if(i < 0) i = liste.findIndex((_,k)=>!f.includes(k));
  if(i < 0) i = (partie.index + 1) % liste.length;
  jouer(partie.theme, i);
};
$("#menu").onclick = accueil;
$("#retour").onclick = accueil;
accueil();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
